<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Geed Balaadh</title>
    <meta name="description" content="Login to your Geed Balaadh account to place orders and make reservations." />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>

<body class="bg-dark text-white">
    <!-- Navbar (same as site) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa fa-utensils me-2"></i><span
                    class="brand-text-shimmer fw-bold">Geed Balaadh</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="fa fa-bars"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav ms-auto py-0 pe-4">
                    <li class="nav-item"><a href="index.html" class="nav-link active">Home</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="menu.html" class="nav-link">Menu</a></li>
                    <li class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Pages</a>
                        <div class="dropdown-menu m-0">
                            <a href="booking.html" class="dropdown-item">Booking</a>
                            <a href="team.html" class="dropdown-item">Our Team</a>
                        </div>
                    </li>
                    <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
                <div id="authNavContainer" class="d-flex align-items-center ms-auto"></div>
            </div>
        </div>
    </nav>

    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card bg-secondary text-white shadow-lg">
                    <div class="card-header bg-dark text-center">
                        <h4 class="mb-0"><i class="fa fa-sign-in-alt me-2"></i>Login to Your Account</h4>
                    </div>
                    <div class="card-body">
                        <div id="loginErrorMsg" class="text-danger mb-3"></div>
                        <form id="loginForm" onsubmit="handleAuthLogin(event)">
                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <input type="email" id="loginEmailInput" class="form-control"
                                    placeholder="name@example.com" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="loginPasswordInput" class="form-control"
                                    placeholder="••••••••" required />
                            </div>
                            <button type="submit" class="btn btn-primary w-100"><i class="fa fa-sign-in-alt me-1"></i>
                                Log In</button>
                        </form>
                    </div>
                    <div class="card-footer bg-dark text-center">
                        <small>Don't have an account? <a href="register.html" class="text-warning">Register
                                here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-center text-white py-4">
        <p class="mb-0">© 2026 Geed Balaadh. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dalabat-api.js"></script>
</body>

</html>
